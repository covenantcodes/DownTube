<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DownTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#111111;
    --paper:#f4efe1;
    --card:#fffdf7;
    --coral:#ff5470;
    --yellow:#ffd400;
    --blue:#4d7cfe;
    --green:#00c853;
  }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body {
    font-family:"Space Grotesk", system-ui, sans-serif;
    background-color:var(--paper);
    background-image:radial-gradient(rgba(17,17,17,.14) 1.5px, transparent 1.5px);
    background-size:24px 24px;
    color:var(--ink);
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:24px;
    overflow-x:hidden;
  }

  .deco {
    position:fixed;
    font-size:2.6rem;
    font-weight:800;
    color:rgba(17,17,17,.16);
    pointer-events:none;
    user-select:none;
  }
  .deco.tl { top:24px; left:32px; }
  .deco.br { bottom:24px; right:32px; }
  @media (max-width:640px) { .deco { display:none; } }

  .wrap { position:relative; width:100%; max-width:600px; }

  .badge {
    position:absolute;
    top:-22px; right:-16px;
    background:var(--yellow);
    border:3px solid var(--ink);
    border-radius:50%;
    width:84px; height:84px;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    font-size:.62rem;
    font-weight:800;
    text-transform:uppercase;
    line-height:1.15;
    transform:rotate(9deg);
    box-shadow:4px 4px 0 var(--ink);
    z-index:2;
  }

  .card {
    position:relative;
    width:100%;
    background:var(--card);
    border:4px solid var(--ink);
    box-shadow:10px 10px 0 var(--ink);
    padding:32px;
  }
  @media (max-width:480px) {
    .card { padding:20px; box-shadow:7px 7px 0 var(--ink); }
    .badge { width:66px; height:66px; font-size:.55rem; top:-16px; right:-10px; }
  }

  .head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  h1 {
    font-size:clamp(2rem, 7vw, 2.6rem);
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:-0.02em;
    line-height:1;
  }
  .tag {
    background:var(--blue);
    color:#fff;
    border:2px solid var(--ink);
    padding:4px 10px;
    font-size:.68rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
    transform:rotate(-3deg);
    box-shadow:3px 3px 0 var(--ink);
  }
  .rule { height:4px; background:var(--ink); margin:16px 0 22px; }

  label.field-label {
    display:block;
    font-size:.7rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.06em;
    margin-bottom:6px;
    color:var(--ink);
  }

  .row { display:flex; gap:10px; }
  @media (max-width:480px) { .row { flex-direction:column; } }

  input, select {
    font-family:inherit;
    flex:1;
    min-width:0;
    padding:14px;
    border:3px solid var(--ink);
    background:#fff;
    color:var(--ink);
    font-size:.95rem;
    font-weight:600;
    border-radius:0;
    outline:none;
  }
  input::placeholder { color:#8a8474; font-weight:500; }
  input:focus { box-shadow:4px 4px 0 var(--blue); }

  button {
    font-family:inherit;
    padding:14px 22px;
    border:3px solid var(--ink);
    border-radius:0;
    background:var(--yellow);
    color:var(--ink);
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.02em;
    font-size:.9rem;
    cursor:pointer;
    box-shadow:5px 5px 0 var(--ink);
    transition:transform .08s ease, box-shadow .08s ease, opacity .15s ease;
    white-space:nowrap;
  }
  button:hover:not(:disabled) { transform:translate(-2px,-2px); box-shadow:7px 7px 0 var(--ink); }
  button:active:not(:disabled) { transform:translate(3px,3px); box-shadow:2px 2px 0 var(--ink); }
  button:disabled { opacity:.5; cursor:not-allowed; box-shadow:5px 5px 0 var(--ink); }

  #dlBtn { background:var(--coral); color:#fff; }

  #preview { display:none; margin-top:26px; padding-top:24px; border-top:3px solid var(--ink); }

  .meta { display:flex; gap:14px; margin-bottom:18px; }
  @media (max-width:480px) { .meta { flex-direction:column; } }
  .meta img {
    width:150px; flex-shrink:0;
    aspect-ratio:16/9;
    object-fit:cover;
    border:3px solid var(--ink);
    box-shadow:5px 5px 0 var(--blue);
    transform:rotate(-1deg);
    background:#ddd;
  }
  @media (max-width:480px) { .meta img { width:100%; transform:none; } }
  .meta h2 {
    font-size:1.02rem;
    font-weight:700;
    text-transform:uppercase;
    line-height:1.3;
    margin-bottom:8px;
  }
  .chip-row { display:flex; gap:6px; flex-wrap:wrap; }
  .chip {
    display:inline-block;
    border:2px solid var(--ink);
    background:var(--paper);
    padding:2px 9px;
    font-size:.72rem;
    font-weight:700;
    text-transform:uppercase;
  }

  .select-wrap { position:relative; flex:1; min-width:0; }
  .select-wrap select { width:100%; appearance:none; padding-right:36px; cursor:pointer; }
  .select-wrap::after {
    content:"▼";
    position:absolute; right:14px; top:50%;
    transform:translateY(-50%);
    font-size:.65rem;
    pointer-events:none;
  }

  .bar {
    height:22px;
    border:3px solid var(--ink);
    background:#fff;
    overflow:hidden;
    margin-top:20px;
    display:none;
    position:relative;
  }
  .bar div {
    height:100%; width:0;
    background:repeating-linear-gradient(45deg, var(--yellow) 0 10px, var(--coral) 10px 20px);
    background-size:28px 28px;
    animation:stripes 1s linear infinite;
    transition:width .3s ease;
  }
  @keyframes stripes { to { background-position:28px 0; } }

  #status {
    margin-top:14px;
    font-weight:700;
    font-size:.85rem;
    min-height:1.4em;
    text-transform:uppercase;
    letter-spacing:.01em;
  }
  #status.err, #status.ok {
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:7px 12px;
    border:2px solid var(--ink);
    box-shadow:3px 3px 0 var(--ink);
  }
  #status.err { background:var(--coral); color:#fff; }
  #status.ok { background:var(--green); color:#fff; }

  .footer-note {
    margin-top:20px;
    text-align:center;
    font-size:.7rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:rgba(17,17,17,.55);
  }
</style>
</head>
<body>
<span class="deco tl">+</span>
<span class="deco br">+</span>

<div class="wrap">
  <div class="badge">100%<br>Free</div>
  <div class="card">
    <div class="head">
      <h1>DownTube</h1>
      <span class="tag">▶ YT Grabber</span>
    </div>
    <div class="rule"></div>

    <label class="field-label" for="url">Paste a link</label>
    <div class="row">
      <input id="url" placeholder="https://youtube.com/watch?v=…">
      <button id="fetchBtn">Fetch</button>
    </div>

    <div id="preview">
      <div class="meta">
        <img id="thumb" alt="">
        <div>
          <h2 id="title"></h2>
          <div class="chip-row" id="sub"></div>
        </div>
      </div>
      <label class="field-label" for="quality">Quality</label>
      <div class="row">
        <div class="select-wrap"><select id="quality"></select></div>
        <button id="dlBtn">Download</button>
      </div>
    </div>

    <div class="bar" id="bar"><div id="fill"></div></div>
    <p id="status"></p>
  </div>
  <p class="footer-note">Paste → Fetch → Download. That's it.</p>
</div>

<script>
const $ = id => document.getElementById(id);
const labels = { best:"Best quality", "1080":"1080p", "720":"720p", "480":"480p", audio:"Audio only (MP3)" };

function setStatus(msg, type = "") { $("status").textContent = msg; $("status").className = type; }
function fmtTime(s) { if (!s) return ""; s = Math.round(s); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }

async function api(path, body) {
  const res = await fetch(path, body ? { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(body) } : {});
  const data = await res.json();
  if (!res.ok) throw new Error(data.detail || "Request failed");
  return data;
}

$("fetchBtn").onclick = async () => {
  const url = $("url").value.trim();
  if (!url) return;
  $("fetchBtn").disabled = true; $("preview").style.display = "none"; $("bar").style.display = "none";
  setStatus("Fetching video info…");
  try {
    const info = await api("/api/info", { url });
    $("thumb").src = info.thumbnail || "";
    $("title").textContent = info.title;
    $("sub").innerHTML = [info.channel, fmtTime(info.duration)].filter(Boolean).map(v => `<span class="chip">${v}</span>`).join("");
    $("quality").innerHTML = info.qualities.map(q => `<option value="${q}">${labels[q]}</option>`).join("");
    $("preview").style.display = "block";
    setStatus("");
  } catch (e) { setStatus(e.message, "err"); }
  $("fetchBtn").disabled = false;
};

$("dlBtn").onclick = async () => {
  $("dlBtn").disabled = true; $("bar").style.display = "block"; $("fill").style.width = "0";
  setStatus("Starting…");
  const stop = (poll, msg, type) => { clearInterval(poll); setStatus(msg, type); $("dlBtn").disabled = false; };
  try {
    const { job_id } = await api("/api/download", { url:$("url").value.trim(), quality:$("quality").value });
    const poll = setInterval(async () => {
      try {
        const p = await api(`/api/progress/${job_id}`);
        $("fill").style.width = p.progress + "%";
        if (p.status === "downloading") setStatus(`Downloading ${p.progress}%${p.speed ? " · " + p.speed : ""}`);
        else if (p.status === "processing") setStatus("Merging / converting…");
        else if (p.status === "done") { stop(poll, "Done — saving file.", "ok"); window.location.href = `/api/file/${job_id}`; }
        else if (p.status === "error") stop(poll, p.error, "err");
      } catch (e) { stop(poll, e.message, "err"); }
    }, 800);
  } catch (e) { setStatus(e.message, "err"); $("dlBtn").disabled = false; }
};

$("url").addEventListener("keydown", e => { if (e.key === "Enter") $("fetchBtn").click(); });
</script>
</body>
</html>
