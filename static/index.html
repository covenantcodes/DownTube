<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DownTube</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --text:#e8eaed; --muted:#8b93a1; --accent:#ff4d4d; --border:#2a2f3a; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:grid; place-items:center; padding:16px; }
  .card { width:100%; max-width:560px; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:24px; }
  h1 { font-size:1.3rem; margin-bottom:16px; }
  .row { display:flex; gap:8px; }
  input, select { flex:1; min-width:0; padding:12px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:.95rem; }
  button { padding:12px 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  #preview { display:none; margin-top:20px; }
  .meta { display:flex; gap:12px; margin-bottom:16px; }
  .meta img { width:140px; aspect-ratio:16/9; border-radius:8px; object-fit:cover; }
  .meta h2 { font-size:1rem; line-height:1.3; }
  .meta p { color:var(--muted); font-size:.85rem; margin-top:4px; }
  .bar { height:8px; background:var(--bg); border-radius:4px; overflow:hidden; margin-top:16px; display:none; }
  .bar div { height:100%; width:0; background:var(--accent); transition:width .3s; }
  #status { color:var(--muted); font-size:.85rem; margin-top:10px; min-height:1.2em; }
  #status.err { color:var(--accent); }
</style>
</head>
<body>
<div class="card">
  <h1>DownTube</h1>
  <div class="row">
    <input id="url" placeholder="Paste a YouTube link">
    <button id="fetchBtn">Fetch</button>
  </div>
  <div id="preview">
    <div class="meta">
      <img id="thumb" alt="">
      <div><h2 id="title"></h2><p id="sub"></p></div>
    </div>
    <div class="row">
      <select id="quality"></select>
      <button id="dlBtn">Download</button>
    </div>
  </div>
  <div class="bar" id="bar"><div id="fill"></div></div>
  <p id="status"></p>
</div>
<script>
const $ = id => document.getElementById(id);
const labels = { best:"Best quality", "1080":"1080p", "720":"720p", "480":"480p", audio:"Audio only (MP3)" };

function setStatus(msg, err = false) { $("status").textContent = msg; $("status").className = err ? "err" : ""; }
function fmtTime(s) { if (!s) return ""; s = Math.round(s); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }

async function api(path, body) {
  const res = await fetch(path, body ? { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(body) } : {});
  const data = await res.json();
  if (!res.ok) throw new Error(data.detail || "Request failed");
  return data;
}

$("fetchBtn").onclick = async () => {
  const url = $("url").value.trim();
  if (!url) return;
  $("fetchBtn").disabled = true; $("preview").style.display = "none"; $("bar").style.display = "none";
  setStatus("Fetching video info…");
  try {
    const info = await api("/api/info", { url });
    $("thumb").src = info.thumbnail || "";
    $("title").textContent = info.title;
    $("sub").textContent = [info.channel, fmtTime(info.duration)].filter(Boolean).join(" · ");
    $("quality").innerHTML = info.qualities.map(q => `<option value="${q}">${labels[q]}</option>`).join("");
    $("preview").style.display = "block";
    setStatus("");
  } catch (e) { setStatus(e.message, true); }
  $("fetchBtn").disabled = false;
};

$("dlBtn").onclick = async () => {
  $("dlBtn").disabled = true; $("bar").style.display = "block"; $("fill").style.width = "0";
  setStatus("Starting…");
  const stop = (poll, msg, err) => { clearInterval(poll); setStatus(msg, err); $("dlBtn").disabled = false; };
  try {
    const { job_id } = await api("/api/download", { url:$("url").value.trim(), quality:$("quality").value });
    const poll = setInterval(async () => {
      try {
        const p = await api(`/api/progress/${job_id}`);
        $("fill").style.width = p.progress + "%";
        if (p.status === "downloading") setStatus(`Downloading ${p.progress}%${p.speed ? " · " + p.speed : ""}`);
        else if (p.status === "processing") setStatus("Merging / converting…");
        else if (p.status === "done") { stop(poll, "Done — saving file."); window.location.href = `/api/file/${job_id}`; }
        else if (p.status === "error") stop(poll, p.error, true);
      } catch (e) { stop(poll, e.message, true); }
    }, 800);
  } catch (e) { setStatus(e.message, true); $("dlBtn").disabled = false; }
};

$("url").addEventListener("keydown", e => { if (e.key === "Enter") $("fetchBtn").click(); });
</script>
</body>
</html>
