<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DownTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<span class="deco tl">+</span>
<span class="deco br">+</span>

<div class="wrap">
  <div class="badge">NO<br>ADS</div>
  <div class="card">
    <div class="head">
      <h1>DownTube</h1>
      <span class="tag">▶ YT Grabber</span>
    </div>
    <div class="rule"></div>

    <label class="field-label" for="url">Paste a link</label>
    <div class="row">
      <input id="url" placeholder="https://youtube.com/watch?v=…">
      <button id="fetchBtn">Fetch</button>
    </div>

    <div id="preview">
      <div class="meta">
        <img id="thumb" alt="">
        <div>
          <h2 id="title"></h2>
          <div class="chip-row" id="sub"></div>
        </div>
      </div>
      <label class="field-label" for="quality">Quality</label>
      <div class="row">
        <div class="select-wrap"><select id="quality"></select></div>
        <button id="dlBtn">Download</button>
      </div>
    </div>

    <div class="bar" id="bar"><div id="fill"></div></div>
    <p id="status"></p>
  </div>
  <p class="footer-note">Paste → Fetch → Download. That's it.</p>
  <p class="credit">Designed by <a href="https://www.linkedin.com/in/covenantifeoluwa/" target="_blank" rel="noopener">covenantcodes</a></p>
</div>

<script src="app.js"></script>
</body>
</html>
